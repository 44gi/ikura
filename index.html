<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17243e">
  <title>Salmon Clicker</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; background: #17243e; color: #fff2d3; font: 500 15px/1.5 system-ui, sans-serif; }
    main { position: relative; width: min(100vw, 177.7778dvh); aspect-ratio: 16 / 9; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 20px; }
    #loading[hidden] { display: none; }
    progress { width: min(216px, 64vw); accent-color: #ffc22e; }
  </style>
</head>
<body>
  <main aria-label="Salmon Clicker">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Salmon Clickerのゲーム画面"></canvas>
    <div id="loading" role="status">
      <span id="status">Salmon Clickerを読み込み中</span>
      <progress id="progress" max="1" value="0" aria-label="読み込みの進み具合"></progress>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const gameTitle = "Salmon Clicker";
    const loading = document.getElementById("loading");
    const progress = document.getElementById("progress");
    const loader = document.createElement("script");
    loader.src = "7754c6f6e30d9d511dc9312d98e06577.loader.js";
    function showFailure(error) {
      console.error(error);
      progress.hidden = true;
      document.getElementById("status").textContent = "読み込めませんでした。ページを再読み込みしてください。";
    }
    loader.onerror = showFailure;
    loader.onload = () => {
      if (!window.createUnityInstance) { showFailure("Unity loader unavailable"); return; }
      createUnityInstance(canvas, {
        dataUrl: "fe471694fc0829fe70e35e9b7cab6dec.data.unityweb",
        frameworkUrl: "7a88a6ab9c5ba30bf8edea64c2a38d58.framework.js.unityweb",
        codeUrl: "2f83cc20f62f41180c94d39c499cd24f.wasm.unityweb",
        companyName: "DefaultCompany",
        productName: gameTitle,
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25)
      }, value => { progress.value = value; }).then(instance => {
        const updateGameFocus = () => {
          const active = document.visibilityState === "visible" && document.hasFocus();
          instance.SendMessage(gameTitle, "SetBrowserActive", active ? 1 : 0);
        };
        window.addEventListener("blur", () => instance.SendMessage(gameTitle, "SetBrowserActive", 0));
        window.addEventListener("focus", updateGameFocus);
        document.addEventListener("visibilitychange", updateGameFocus);
        updateGameFocus();
        loading.hidden = true;
        canvas.focus({preventScroll: true});
      }).catch(showFailure);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
